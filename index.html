<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>مدیریت املاک</title>
  <script src="https://unpkg.com/@supabase/supabase-js"></script>
  <style>
    body {
      font-family: sans-serif;
      direction: rtl;
      padding: 20px;
      max-width: 800px;
      margin: auto;
      font-size: 18px;
    }
    input, button {
      width: 100%;
      padding: 10px;
      margin: 5px 0;
      font-size: 16px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }
    th, td {
      border: 1px solid #ccc;
      padding: 8px;
      text-align: center;
    }
  </style>
</head>
<body>

<h1>مدیریت املاک</h1>

<form id="estateForm">
  <input type="text" id="owner" placeholder="نام مالک" required />
  <input type="number" id="floor" placeholder="طبقه" />
  <input type="number" id="area" placeholder="متراژ (متر مربع)" step="0.01" required />
  <input type="number" id="bedroom" placeholder="تعداد خواب" />
  <input type="number" id="pricePerMeter" placeholder="قیمت هر متر (تومان)" step="0.01" required />
  <input type="number" id="totalPrice" placeholder="قیمت کل (تومان)" step="0.01" required />
  <button type="submit">افزودن ملک</button>
</form>

<table id="estateTable">
  <thead>
    <tr>
      <th>نام مالک</th>
      <th>طبقه</th>
      <th>متراژ</th>
      <th>خواب</th>
      <th>قیمت هر متر</th>
      <th>قیمت کل</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>

<script>
  const supabase = supabase.createClient(
    "https://mcxrjcycszhdxpoeyaco.supabase.co",
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1jeHJqY3ljc3poZHhwb2V5YWNvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDYzMDQ0MjQsImV4cCI6MjA2MTg4MDQyNH0.bgXGjU1ep2UQMC2EAAr2jPku2tKWx72yxs_0mXBYDVw"
  );

  const form = document.getElementById("estateForm");
  const table = document.getElementById("estateTable").querySelector("tbody");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();

    const data = {
      owner: form.owner.value,
      floor: parseInt(form.floor.value || 0),
      area: parseFloat(form.area.value),
      bedroom: parseInt(form.bedroom.value || 0),
      price_per_meter: parseFloat(form.pricePerMeter.value),
      total_price: parseFloat(form.totalPrice.value)
    };

    const { error } = await supabase.from("mehrdad").insert([data]);

    if (error) {
      alert("خطا در ذخیره‌سازی: " + error.message);
    } else {
      alert("با موفقیت ذخیره شد!");
      form.reset();
      loadData();
    }
  });

  async function loadData() {
    const { data, error } = await supabase.from("mehrdad").select("*").order("created_at", { ascending: false });

    if (!error) {
      table.innerHTML = "";
      data.forEach(row => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${row.owner}</td>
          <td>${row.floor}</td>
          <td>${row.area}</td>
          <td>${row.bedroom}</td>
          <td>${row.price_per_meter}</td>
          <td>${row.total_price}</td>
        `;
        table.appendChild(tr);
      });
    }
  }

  loadData();
</script>

</body>
</html>
